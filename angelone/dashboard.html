<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harish Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%237E2617%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F1E9; --panel:#FBFAF6; --ink:#1C1A16; --ink2:#3B3832; --mute:#77726A; --rule:#DCD5C6; --rule2:#E9E4D8;
  --brick:#7E2617; --tint:rgba(126,38,23,.08);
  --up:#14774A; --upbg:rgba(20,119,74,.09); --dn:#B4271C; --dnbg:rgba(180,39,28,.08); --warn:#A35F00; --warnbg:rgba(163,95,0,.1);
  --ce:#B4271C; --pe:#14774A; --s3:#2F5E9E; --s4:#8A5A9E; --s5:#B07A14;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --sans:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif; --num:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans)}
a{color:var(--brick)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brick);outline-offset:2px}
.lbl{font:500 10.5px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.mono{font-family:var(--mono)}
.up{color:var(--up)}.dn{color:var(--dn)}.wn{color:var(--warn)}.mu{color:var(--mute)}
.n{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:0 20px;height:52px;background:var(--paper);border-bottom:1px solid var(--rule)}
.brand{font:600 15px/1 var(--mono);letter-spacing:.18em;color:var(--brick);white-space:nowrap}
.brand small{display:block;font:500 9px/1 var(--mono);letter-spacing:.2em;color:var(--mute);margin-top:4px}
.crumb{font:500 11px var(--mono);letter-spacing:.12em;color:var(--mute);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.clock{font:500 12px var(--mono);letter-spacing:.06em;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:3px;padding:4px 9px;font:600 10.5px var(--mono);letter-spacing:.12em;white-space:nowrap;background:var(--panel)}
.pill.ok{color:var(--up);border-color:rgba(20,119,74,.35)}
.pill.bad{color:#fff;background:var(--dn);border-color:var(--dn)}
.pill.off{color:var(--mute)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.live .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live .dot{animation:none}}

/* shell */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100vh - 52px)}
aside{border-right:1px solid var(--rule);padding:16px 14px 40px;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
main{padding:22px 28px 80px;min-width:0}

/* MTM card */
.mtm{background:var(--panel);border:1px solid var(--rule);padding:14px 14px 12px;margin-bottom:18px}
.mtm .big{font:600 40px/1.05 var(--num);letter-spacing:-.01em;margin:6px 0 8px}
.mtm .ln{display:flex;justify-content:space-between;font:12.5px var(--sans);padding:3px 0;border-top:1px solid var(--rule2)}
.mtm .ln b{font:500 12.5px var(--mono)}
.mtm svg{display:block;width:100%;height:46px;margin:8px 0 4px}
.mtm .ft{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--mute)}

nav .grp{margin:14px 0 4px;padding-left:6px}
nav a{display:flex;align-items:center;gap:10px;padding:6px 8px;text-decoration:none;color:var(--ink2);border-left:2px solid transparent;font-size:13.5px}
nav a .cd{font:600 10.5px var(--mono);letter-spacing:.06em;color:var(--mute);width:22px}
nav a:hover{background:rgba(0,0,0,.03)}
nav a.on{background:var(--tint);border-left-color:var(--brick);color:var(--ink);font-weight:500}
nav a.on .cd{color:var(--brick)}
nav a .badge{margin-left:auto;font:600 10px var(--mono);color:#fff;background:var(--dn);border-radius:8px;padding:0 6px}

/* section */
.sh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:16px}
.sh h1{font:600 13px var(--mono);letter-spacing:.14em;text-transform:uppercase;margin:0}
.sh p{margin:0;color:var(--mute);font-size:13.5px}
.sh .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h2{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;margin:28px 0 4px;color:var(--ink)}
h2 + .sub{margin:0 0 10px;color:var(--mute);font-size:13px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-top:1px solid var(--rule);border-left:1px solid var(--rule);margin-bottom:14px}
.kpi{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 14px 12px;background:var(--panel);min-width:0}
.kpi .v{font:600 30px/1.1 var(--num);margin:6px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.hero .v{font-size:38px}
.kpi .d{font-size:12.5px;color:var(--mute)}

.say{border-left:3px solid var(--brick);background:var(--panel);padding:10px 14px;font-size:14px;margin:0 0 14px;border-top:1px solid var(--rule2);border-right:1px solid var(--rule2);border-bottom:1px solid var(--rule2)}
.probs{display:flex;flex-direction:column;gap:0;border:1px solid var(--rule);background:var(--panel);margin-bottom:6px}
.prob{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-top:1px solid var(--rule2);font-size:13.5px}
.prob:first-child{border-top:0}
.prob .tg{font:600 10px var(--mono);letter-spacing:.1em;padding:2px 6px;border-radius:2px;flex:none;margin-top:2px}
.prob.bad .tg{background:var(--dn);color:#fff}.prob.warn .tg{background:var(--warn);color:#fff}.prob.ok .tg{background:var(--up);color:#fff}
.prob pre{margin:4px 0 0;white-space:pre-wrap;font:11.5px var(--mono);color:var(--ink2)}

.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:22px}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.box{background:var(--panel);border:1px solid var(--rule);padding:12px 14px}
.chart{position:relative;width:100%}
.chart svg{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:11px var(--mono);color:var(--mute);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:3px;vertical-align:middle;margin-right:5px}

/* players */
.players{display:grid;gap:0;border:1px solid var(--rule);background:var(--panel)}
.pl{display:grid;grid-template-columns:22px 1fr auto;gap:4px 10px;padding:10px 12px;border-top:1px solid var(--rule2);align-items:center}
.pl:first-child{border-top:0}
.pl .rk{font:600 12px var(--mono);color:var(--mute)}
.pl .nm{font-weight:600}.pl .nm small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.pl .eq{font:600 20px var(--num);text-align:right}.pl .eq small{display:block;font:500 12px var(--mono)}
.pl .track{grid-column:2/4;height:6px;background:var(--rule2);position:relative}
.pl .track b{position:absolute;top:0;bottom:0}
.pl .track i{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--mute)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--rule);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--paper)}
th.s{cursor:pointer;user-select:none}th.s:hover{color:var(--ink)}
th .ar{color:var(--brick)}
td{padding:8px 10px;border-bottom:1px solid var(--rule2);vertical-align:middle}
td.r,th.r{text-align:right}
td.r{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.xr{cursor:pointer}
tr.xr:hover td{background:rgba(126,38,23,.035)}
tr.xr.open td{background:var(--tint);border-bottom-color:transparent}
td.chev{width:26px;text-align:center;font:600 13px var(--mono);color:var(--mute)}
tr.xd{display:none}tr.xd.open{display:table-row}
tr.xd > td{background:var(--tint);padding:4px 14px 16px}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 18px;margin:6px 0}
.dl div span{display:block}
.dl div b{font:500 13px var(--mono)}
.prose{max-width:76ch;font-size:13.5px;line-height:1.6}
.prose ul{padding-left:18px;margin:6px 0}.prose li{margin:2px 0}
.prose code,code{font:12px var(--mono);background:rgba(0,0,0,.05);padding:0 3px}
.prose table{font-size:12px;margin:8px 0}
.prose .tw{margin:8px 0 14px}
.prose h3,.prose h4,.prose h5{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;margin:22px 0 6px}
pre.log{white-space:pre-wrap;font:11.5px/1.55 var(--mono);background:var(--paper);border:1px solid var(--rule2);padding:10px;max-height:420px;overflow:auto;margin:8px 0 0}
.chip{border:1px solid var(--rule);background:var(--panel);padding:4px 10px;font:500 11px var(--mono);letter-spacing:.06em;cursor:pointer;border-radius:2px;white-space:nowrap}
.chip:hover{border-color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fbar{display:flex;gap:12px 18px;flex-wrap:wrap;align-items:center;padding:10px 12px;border:1px solid var(--rule);background:var(--panel);margin-bottom:12px}
.fbar label{display:flex;gap:6px;align-items:center}
.fbar input,.fbar select,.tools select{border:1px solid var(--rule);background:var(--paper);padding:3px 6px;font:12px var(--mono);border-radius:2px}
.tag{display:inline-block;font:600 10px var(--mono);letter-spacing:.06em;padding:1px 6px;border-radius:2px;background:rgba(0,0,0,.06);color:var(--ink2);white-space:nowrap}
.tag.live{background:var(--brick);color:#fff}.tag.paper{background:#E4DED0}.tag.alert{background:var(--dn);color:#fff}
.tag.up{background:var(--upbg);color:var(--up)}.tag.dn{background:var(--dnbg);color:var(--dn)}
.empty{border:1px dashed var(--rule);padding:22px;text-align:center;color:var(--mute);background:var(--panel);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

/* stop bar */
.sbar{position:relative;height:30px;min-width:180px;margin:0 4px}
.sbar .tr{position:absolute;left:0;right:0;top:13px;height:4px;background:var(--rule2)}
.sbar .zn{position:absolute;left:0;top:13px;height:4px;background:var(--dn);opacity:.55}
.sbar .gain{position:absolute;top:13px;height:4px}
.sbar .mk{position:absolute;top:8px;width:2px;height:14px;margin-left:-1px}
.sbar .mk span{position:absolute;left:50%;transform:translateX(-50%);font:500 9.5px var(--mono);white-space:nowrap;color:var(--mute)}
.sbar .mk.st{background:var(--dn)}.sbar .mk.st span{top:15px;color:var(--dn)}
.sbar .mk.en{background:var(--ink2)}.sbar .mk.en span{top:15px}
.sbar .mk.nw{width:10px;height:10px;border-radius:50%;top:10px;margin-left:-5px;background:var(--ink);border:2px solid var(--panel)}
.sbar .mk.nw span{top:-13px;color:var(--ink)}

/* meters */
.meter{margin:8px 0 2px;height:6px;background:var(--rule2);position:relative}
.meter b{position:absolute;left:0;top:0;bottom:0;background:var(--ink2)}

/* OI butterfly */
.oi{border:1px solid var(--rule);background:var(--panel);padding:8px 10px}
.oih,.oir{display:grid;grid-template-columns:minmax(0,1fr) 74px minmax(0,1fr);align-items:center;gap:8px}
.oih{font:600 10px var(--mono);letter-spacing:.1em;color:var(--mute);padding:4px 0 8px;border-bottom:1px solid var(--rule2);margin-bottom:4px}
.oih .l{text-align:right}
.oir{height:19px;cursor:default}
.oir:hover{background:rgba(0,0,0,.035)}
.oir .k{text-align:center;font:500 11.5px var(--mono)}
.oir.atm .k{background:var(--ink);color:var(--paper)}
.oir.mp .k{outline:1.5px solid var(--brick);color:var(--brick)}
.oir .bl,.oir .br{position:relative;height:12px}
.oir .bl b,.oir .bl i{position:absolute;right:0;top:0;bottom:0}
.oir .br b,.oir .br i{position:absolute;left:0;top:0;bottom:0}
.oir i{border:1px dashed currentColor;opacity:.55}
.oir .bl{color:var(--ce)}.oir .br{color:var(--pe)}
.oir .bl b{background:var(--ce);opacity:.78}.oir .br b{background:var(--pe);opacity:.78}

/* timeline */
.tl{position:relative;height:72px;border:1px solid var(--rule);background:var(--panel);margin-bottom:6px}
.tl .ax{position:absolute;left:16px;right:16px;top:36px;height:1px;background:var(--rule)}
.tl .tk{position:absolute;top:44px;font:10px var(--mono);color:var(--mute);transform:translateX(-50%)}
.tl .ev{position:absolute;top:30px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid var(--ink2);background:var(--panel)}
.tl .ev.done{background:var(--up);border-color:var(--up)}
.tl .ev.err{background:var(--dn);border-color:var(--dn);width:16px;height:16px;margin-left:-8px;top:28px}
.tl .now{position:absolute;top:8px;bottom:8px;width:1px;background:var(--brick)}
.tl .now span{position:absolute;top:-2px;left:4px;font:600 9px var(--mono);color:var(--brick)}

.lines{border:1px solid var(--rule);background:var(--panel);font:12px/1.5 var(--mono);max-height:70vh;overflow:auto}
.lines div{display:grid;grid-template-columns:150px 58px 1fr;gap:10px;padding:3px 10px;border-bottom:1px solid var(--rule2)}
.lines div.al{background:var(--dnbg)}
.lines div:hover{background:rgba(0,0,0,.03)}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{border:0;background:transparent;padding:5px 14px;font:600 11px var(--mono);letter-spacing:.1em;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper)}

#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--paper);font:12px/1.45 var(--mono);padding:7px 10px;max-width:300px;white-space:pre-line;opacity:0;transition:opacity .08s;border-radius:2px}
#tip.show{opacity:1}
.err{color:var(--dn);font:12px var(--mono)}
.foot{margin-top:40px;font:11px var(--mono);color:var(--mute)}

@media (max-width:1100px){.cols{grid-template-columns:1fr}}
@media (max-width:900px){
  .top{height:auto;flex-wrap:wrap;padding:10px 16px;gap:8px 12px}
  .crumb{display:none}
  .top .sp{display:none}
  .shell{display:block}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule);padding:12px 16px 0}
  .mtm{margin-bottom:10px}
  .mtm .big{font-size:34px}
  nav{display:flex;overflow-x:auto;gap:2px;padding-bottom:8px;margin:0 -16px;padding-left:16px;scrollbar-width:none}
  nav .grp{display:none}
  nav a{border-left:0;border-bottom:2px solid transparent;white-space:nowrap;padding:6px 8px}
  nav a.on{border-bottom-color:var(--brick)}
  main{padding:16px 16px 60px}
  .cols2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:24px}.kpi.hero{grid-column:1/-1}
  .kpis:has(.hero) .kpi:last-child:nth-child(even),.kpis:not(:has(.hero)) .kpi:last-child:nth-child(odd){grid-column:1/-1}
  .brand small{display:none}.clock{font-size:11px;margin-left:auto}.pill{padding:3px 7px;font-size:9.5px}
  .mtm svg{height:30px}.kpi.hero .v{font-size:34px}
  .lines div{grid-template-columns:1fr;gap:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">HARISH DESK<small>READ-ONLY · LOCAL</small></div>
  <div class="crumb" id="crumb"></div>
  <div class="sp"></div>
  <div class="clock n" id="clock"></div>
  <span class="pill off" id="mkt"><span class="dot"></span>…</span>
  <span class="pill" id="risk">RISK –</span>
  <span class="pill" id="kill">KILL SWITCH –</span>
</header>
<div class="shell">
  <aside>
    <div class="mtm" id="mtm"><div class="lbl">Today · real money</div><div class="big">…</div></div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<div id="tip"></div>
<script>
"use strict";
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ok = n => n != null && n !== "" && !isNaN(n);
const inr = (n, d = 0) => !ok(n) ? "–" : (n < 0 ? "−" : "") + "₹" + Math.abs(+n).toLocaleString("en-IN", {minimumFractionDigits: d, maximumFractionDigits: d});
const sgn = (n, d = 0) => !ok(n) ? "–" : (n > 0 ? "+" : "") + inr(n, d);
const tone = n => n > 0 ? "up" : n < 0 ? "dn" : "";
const num = (n, d = 0) => !ok(n) ? "–" : (+n).toLocaleString("en-IN", {maximumFractionDigits: d});
const big = n => !ok(n) ? "–" : Math.abs(n) >= 1e7 ? (n / 1e7).toFixed(2) + " Cr" : Math.abs(n) >= 1e5 ? (n / 1e5).toFixed(2) + " L" : num(n);
const pct = (n, d = 1) => !ok(n) ? "–" : (+n).toFixed(d) + "%";
const get = p => fetch("/api/" + p).then(r => { if (!r.ok) throw new Error(p + " " + r.status); return r.json(); });
const today = () => new Date().toLocaleDateString("en-CA", {timeZone: "Asia/Kolkata"});
const COST = 47;          // approx. sell charges per stock position, for "profit if sold now"
const OPT_CAPITAL = 30000;
const PLAYERS = [
  {key: "opt_bot", name: "Bot", acct: "Options Bot", who: "Buys every breakout, fixed rules", c: "var(--ink)"},
  {key: "opt_brain", name: "Brain", acct: "Options Brain", who: "Claude picks the side or skips the day", c: "var(--brick)"},
  {key: "opt_flow", name: "Order flow", acct: "Options Flow", who: "Follows option open interest", c: "var(--s3)"},
  {key: "opt_fly", name: "Fly", acct: "Options Fly", who: "Sells a hedged iron fly, collects premium", c: "var(--s4)", seller: true},
  {key: "opt_hybrid", name: "Hybrid", acct: "Options Hybrid", who: "Claude picks the plan: buy breakout, sell fly, or skip", c: "var(--s5)"},
];
const JOBS = {"trader.py enter --live": "Buy/sell · real", "trader.py scan --live": "Evening check · real", "trader.py enter": "Buy/sell · practice",
  "trader.py scan": "Evening check · practice", "watcher.py": "Price watcher", "options_paper.py": "Options practice",
  "options_recorder.py": "Option data recorder", "live_test.py": "Live order test", "dashboard.py": "This dashboard"};
const jobName = cmd => { const a = cmd.split(" "); if (a[0] === "brain.sh") return "Brain · " + a[1].toLowerCase() + " check";
  const k = a.slice(a[0] === "run.sh" ? 1 : a[0] === "python" ? 1 : 0).join(" "); return JOBS[k] || k; };
const BRAIN = {PUTS_ONLY: "Puts only", CALLS_ONLY: "Calls only", TRADE: "Trade both ways", SKIP: "Skip the day"};

const S = {sec: "ov", open: new Set(), d: {}, at: 0, err: "",
  jr: {acct: "All", from: "", to: ""}, lg: {f: "ALL", q: ""}, oc: {idx: "NIFTY", day: ""}, pt: "opt", dd: "All", stTab: "buy", sort: {}};

// ---------- tooltip ----------
const tip = $("#tip");
function showTip(e) {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { tip.classList.remove("show"); document.querySelectorAll(".guide").forEach(g => g.setAttribute("opacity", 0)); return; }
  tip.textContent = t.dataset.tip; tip.classList.add("show");
  const x = e.clientX, y = e.clientY, w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(6, Math.min(innerWidth - w - 6, x + 14)) + "px";
  tip.style.top = (y + h + 22 > innerHeight ? y - h - 12 : y + 16) + "px";

  sp.series.forEach((s, si) => {

function drawCols(el, sp) {   // grouped columns around zero

  const tabs = [["buy", "BUYING"], ["sell", "SELLING"], ["flow", "ORDER FLOW"], ["stk", "STOCKS"]];
  const seg = `<div class="seg">${tabs.map(([k, l]) => `<button data-sttab="${k}" class="${S.stTab === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
  const parts = {buy: () => `<h2 style="margin-top:6px">Options buying ideas</h2><div class="sub">docs/options_ideas.csv · total = ₹ profit over all test days. Click headers to sort.</div>` +
    (ideas.length ? hbars(ideas.map(r => ({label: r.idea, v: +r.total, tip: `${r.idea}\nTotal ${sgn(+r.total)} over ${r.days} days\nWinning days ${r.win_days}\nLast 25 days ${sgn(+r.last25)}\nWorst day ${sgn(+r.worst_day)} · best ${sgn(+r.best_day)}`})).sort((a, b) => b.v - a.v)) + `<div style="height:10px"></div>` : "") +
    tbl("ideas", ideas, [["Idea", "idea"], ["Days", "days", 1], ["Win days", "win_days", 1], ["Total ₹", "total", 1], ["1st half", "first_half", 1], ["2nd half", "second_half", 1], ["Last 25", "last25", 1], ["Worst day", "worst_day", 1], ["Best day", "best_day", 1]], "total", "docs/options_ideas.csv"),
    sell: () => `<h2 style="margin-top:6px">Options selling ideas</h2><div class="sub">docs/options_sell.csv · iron fly / condor at different volatility assumptions. "Broke" = account would have been wiped out.</div>` +
    (sell.length ? hbars(sell.map(r => ({label: `${r.strategy} · IV×${r.iv_mult}`, v: +r.total, tip: `${r.strategy} at IV × ${r.iv_mult}\nTotal ${sgn(+r.total)} over ${r.days} days\nWin rate ${r.win}\nWorst fall ${r.maxDD}${r.broke === "YES" ? "\nWould have gone broke" : ""}`})).sort((a, b) => b.v - a.v)) + `<div style="height:10px"></div>` : "") +
    tbl("sell", sell, [["Strategy", "strategy"], ["IV ×", "iv_mult", 1], ["Days", "days", 1], ["Win", "win", 1], ["Total ₹", "total", 1], ["Last 25", "last25", 1], ["Worst", "worst", 1], ["Best", "best", 1], ["Max fall", "maxDD", 1], ["Broke", "broke"]], "total", "docs/options_sell.csv"),
    flow: () => `<h2 style="margin-top:6px">Order-flow signal test</h2><div class="sub">docs/options_flow.csv · does following open-interest flow beat the plain bot?</div>` +
    (flow.length ? `<div class="kpis">` + kpi("Plain bot", sgn(fbot), tone(fbot), `${flow.length} days`) + kpi("Flow-filtered bot", sgn(fflow), tone(fflow), "only trades the side flow points to") +
      kpi("Flow called direction", `${hits}/${flow.length}`, "", "days the flow side matched the rest of the day") + `</div><div class="box"><div class="legend"><span><i style="background:var(--ink)"></i>Plain bot</span><span><i style="background:var(--s3)"></i>Flow bot</span></div>` +
      chart({x: flow.map(r => r.d), xl: d => d.slice(5), series: [{name: "Plain bot", y: fc.map(c => c[0]), c: "var(--ink)"}, {name: "Flow bot", y: fc.map(c => c[1]), c: "var(--s3)"}], base: 0, fmt: v => sgn(v),
        note: i => `${flow[i].idx} · PCR ${flow[i].pcr} · flow ${flow[i].flow} · ${flow[i].hit === "True" ? "flow was right" : "flow was wrong"}`}, 200) + `</div><div style="height:10px"></div>` +
      tbl("flow", flow, [["Day", "d"], ["Index", "idx"], ["PCR", "pcr", 1], ["Flow", "flow", 1], ["Rest of day %", "rest_pct", 1], ["Right?", "hit"], ["Bot ₹", "bot", 1], ["Flow bot ₹", "flow_bot", 1]], "d", "")
      : empty("No order-flow backtest yet.", "docs/options_flow.csv will appear after that backtest runs.")),
    stk: () => `<h2 style="margin-top:6px">Stock strategy research</h2><div class="sub">docs/strategy_results.md</div><div class="box prose" style="max-width:none">${st.results ? md(st.results) : "–"}</div>`};
  const best = a => a.length ? a.reduce((x, r) => +r.total > +x.total ? r : x, a[0]) : null, bi = best(ideas), bs = best(sell);
  return sh("Strategies", "Backtests: what each idea would have made on past days. Practice money, not advice.", seg) +
    `<div class="kpis">` + kpi("Best buying idea", bi ? sgn(+bi.total) : "–", bi ? tone(+bi.total) : "", bi ? esc(bi.idea) : "no file") +
    kpi("Best selling idea", bs ? sgn(+bs.total) : "–", bs ? tone(+bs.total) : "", bs ? esc(`${bs.strategy} · IV×${bs.iv_mult}`) : "no file") +
    kpi("Flow-filtered bot", flow.length ? sgn(fflow) : "–", tone(fflow), flow.length ? `vs plain bot ${sgn(fbot)}` : "no file") + `</div>` +
    (bi ? say(`${ideas.filter(r => +r.total < 0).length} of ${ideas.length} option-buying ideas lost money over ${esc(bi.days)} test days.` + (bs ? ` The best selling idea (${esc(bs.strategy)}) made ${sgn(+bs.total)}, but check its worst fall of ${esc(bs.maxDD)}.` : "")) : "") + parts[S.stTab]();
};

R.jb = () => {
  const sc = S.d.sc, runs = sc.today_runs, crash = runs.filter(r => r.error).length;
  const H0 = 8.5 * 60, H1 = 17 * 60, xp = m => (Math.max(0, Math.min(1, (m - H0) / (H1 - H0))) * 100).toFixed(2);
  const mins = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
  const nowM = (() => { const d = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Kolkata"})); return d.getHours() * 60 + d.getMinutes(); })();
  const planned = sc.jobs.flatMap(j => j.at.split(", ").filter(t => /^\d+:\d\d$/.test(t)).map(t => ({t, j})));
  const ev = runs.map(r => ({m: mins(r.ts.slice(11, 16)), r}));
  let tl = `<div class="tl"><div style="position:absolute;left:16px;right:16px;top:0;bottom:0">` +
    [9, 10, 11, 12, 13, 14, 15, 16].map(h => `<span class="tk" style="left:${xp(h * 60)}%">${h}:00</span>`).join("") +
    `<div class="ax" style="left:0;right:0"></div>` +
    planned.map(p => `<span class="ev" style="left:${xp(mins(p.t))}%;opacity:.45" data-tip="${esc(`${p.t} scheduled\n${jobName(p.j.cmd)}`)}"></span>`).join("") +
    ev.map(e => `<span class="ev ${e.r.error ? "err" : "done"}" style="left:${xp(e.m)}%" data-tip="${esc(`${e.r.ts.slice(11, 19)} ${jobName("run.sh " + e.r.job)}\n${e.r.error ? "CRASHED · open the row below" : "ran fine"}`)}"></span>`).join("") +
    (nowM > H0 && nowM < H1 ? `<div class="now" style="left:${xp(nowM)}%"><span>NOW</span></div>` : "") + `</div></div>`;
  return sh("Jobs", "The automatic jobs on this Mac (launchd): when they run and whether they worked") +
    `<div class="kpis">` + kpi("Scheduled jobs", sc.jobs.length, "", "on weekdays unless noted") + kpi("Ran today", runs.length, "", "trader/options runs logged") +
    kpi("Crashed today", crash, crash ? "dn" : "up", crash ? "open the red rows below" : "all clean") + `</div>` +
    `<h2>Today on a clock</h2><div class="sub">Faded = scheduled, green = ran, red = crashed. Hover a dot.</div>` + tl +
    `<h2>Today's runs</h2><div class="sub">Crashed runs expand to the error</div>` +
    (runs.length ? tw(`<th>Time</th><th>Job</th><th>Result</th><th></th>`, runs.map(r => r.error ? xrow("jb" + r.ts + r.job, [td(`<span class="mono">${esc(r.ts.slice(11, 19))}</span>`), td(esc(jobName("run.sh " + r.job))), td(`<span class="tag dn">CRASHED</span>`)], `<pre class="log">${esc(r.tb)}</pre>`)
      : `<tr>${td(`<span class="mono">${esc(r.ts.slice(11, 19))}</span>`)}${td(esc(jobName("run.sh " + r.job)))}${td(`<span class="tag up">RAN</span>`)}<td></td></tr>`).join("")) : empty("Nothing has run today yet.", "Jobs start at 9:05 on market days.")) +
    `<h2>Schedule</h2><div class="sub">From ~/Library/LaunchAgents/com.harish.*.plist</div>` +
    tw(`<th>Job</th><th>Runs at</th><th>Days</th><th>Last run</th><th>Command</th>`, sc.jobs.slice().sort((a, b) => mins(a.at.split(",")[0].replace("RunAtLoad", "0:00")) - mins(b.at.split(",")[0].replace("RunAtLoad", "0:00")) || 0).map(j =>
      `<tr>${td(`<b>${esc(jobName(j.cmd))}</b>`)}${td(`<span class="mono">${esc(j.at === "RunAtLoad" ? "always on" : j.at)}</span>`)}${td(esc(j.days))}${td(`<span class="mono ${j.last_run && j.last_run.startsWith(today()) ? "up" : "mu"}">${esc(j.last_run || "–")}</span>`)}${td(`<code>${esc(j.cmd)}</code>`)}</tr>`).join(""));
};

R.lg = () => {
  const ls = S.d.lg ? S.d.lg.lines : [], f = S.lg, q = f.q.toLowerCase();
  const sel = ls.filter(l => (f.f === "ALL" || (f.f === "ALERT" ? / ALERT /.test(l) : l.slice(20, 26).startsWith(f.f))) && (!q || l.toLowerCase().includes(q)));
  const cnt = k => ls.filter(l => k === "ALERT" ? / ALERT /.test(l) : l.slice(20, 26).startsWith(k)).length;
  return sh("Activity log", "What the trading bot wrote to trader.log, newest first (last 600 lines)") +
    `<div class="fbar"><div class="chips">${["ALL", "LIVE", "PAPER", "ALERT"].map(k => `<button class="chip ${f.f === k ? "on" : ""}" data-lg="${k}">${k} <span class="mu">${k === "ALL" ? ls.length : cnt(k)}</span></button>`).join("")}</div>
     <label style="flex:1;min-width:180px"><span class="lbl">Search</span><input id="lgq" type="search" value="${esc(f.q)}" placeholder="BHEL, stop, equity…" style="flex:1"></label><span class="mono mu" style="font-size:12px">${sel.length} lines</span></div>` +
    (sel.length ? `<div class="lines">${sel.map(l => { const m = l.match(/^(\S+ \S+) (LIVE|PAPER)?\s?(.*)$/) || [0, "", "", l], al = / ALERT /.test(l);
      return `<div class="${al ? "al" : ""}"><span class="mu">${esc(m[1])}</span><span>${m[2] ? `<span class="tag ${m[2].toLowerCase()}">${m[2]}</span>` : ""}</span><span>${al ? esc(m[3]).replace("ALERT", '<span class="tag alert">ALERT</span>') : esc(m[3])}</span></div>`; }).join("")}</div>` : empty("No lines match.", "Try another filter or clear the search."));
};

// ---------- tiny markdown (headings, lists, tables, paragraphs) ----------
const inl = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
function md(src) {
  const L = String(src || "").split("\n"), out = []; let i = 0;
  while (i < L.length) {
    const l = L[i];
    if (/^\s*\|/.test(l)) { const t = []; while (i < L.length && /^\s*\|/.test(L[i])) t.push(L[i++]);
      const rows = t.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r)).map(r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
      out.push(`<div class="tw"><table><thead><tr>${rows[0].map(c => `<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map(c => `<td class="${/^-?[\d.,]+%?$/.test(c) ? "r" : ""} ${/^-\d/.test(c) ? "dn" : ""}">${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`); continue; }
    if (/^#{1,4} /.test(l)) { const n = l.match(/^#+/)[0].length; out.push(`<h${n + 2}>${inl(l.slice(n + 1))}</h${n + 2}>`); i++; continue; }
    if (/^\s*([-*]|\d+\.) /.test(l)) { const t = []; while (i < L.length && /^\s*([-*]|\d+\.) /.test(L[i])) t.push(`<li>${inl(L[i++].replace(/^\s*([-*]|\d+\.) /, ""))}</li>`); out.push(`<ul>${t.join("")}</ul>`); continue; }
    if (/^```/.test(l)) { const t = []; i++; while (i < L.length && !/^```/.test(L[i])) t.push(L[i++]); i++; out.push(`<pre class="log">${esc(t.join("\n"))}</pre>`); continue; }
    if (!l.trim()) { i++; continue; }
    const t = []; while (i < L.length && L[i].trim() && !/^(\s*\||#{1,4} |\s*([-*]|\d+\.) |```)/.test(L[i])) t.push(L[i++]);
    out.push(`<p>${inl(t.join(" "))}</p>`);
  }
  return out.join("");
}

// ---------- chrome: nav, sidebar, top bar ----------
function renderNav() {
  const crash = S.d.sc ? S.d.sc.today_runs.filter(r => r.error).length : 0, pr = S.d.ov ? problems().length : 0;
  $("#nav").innerHTML = SECS.map(([g, items]) => `<div class="grp lbl">${g}</div>` + items.map(([id, cd, name]) =>
    `<a href="#${id}" class="${S.sec === id ? "on" : ""}" ${S.sec === id ? 'aria-current="page"' : ""}><span class="cd">${cd}</span>${name}${id === "ov" && pr ? `<span class="badge">${pr}</span>` : id === "jb" && crash ? `<span class="badge">${crash}</span>` : ""}</a>`).join("")).join("");
  const it = SECS.flatMap(s => s[1].map(i => [s[0], ...i])).find(i => i[1] === S.sec);
  $("#crumb").textContent = it ? `${it[0]} / ${it[3]}` : "";
}
function renderSide() {
  const ov = S.d.ov, L = ov.live; if (!L) return;
  const td_ = today(), pts = curve("LIVE").filter(c => c[0].startsWith(td_)).map(c => c[1] - L.day_start);
  pts.push(L.day_pnl);
  const booked = L.journal.filter(r => (r.t1 || "").startsWith(td_)).reduce((s, r) => s + +r.pnl, 0);
  const open = L.positions.reduce((s, p) => s + p.pnl_gross, 0);
  $("#mtm").innerHTML = `<div class="lbl">Daily MTM · real money</div><div class="big n ${tone(L.day_pnl)}">${sgn(L.day_pnl)}</div>
    <div class="ln"><span>Booked today</span><b class="${tone(booked)}">${sgn(booked, 2)}</b></div>
    <div class="ln"><span>Open (gross)</span><b class="${tone(open)}">${sgn(open, 2)}</b></div>
    <div class="ln"><span>Total value</span><b>${inr(L.equity)}</b></div>
    <div data-tip="${esc("Today's profit at each bot check\n(dashed = zero, today's open)")}">${spark(pts, 0)}</div>
    <div class="ft"><span>H ${sgn(Math.max(...pts))} · L ${sgn(Math.min(...pts))}</span><span class="ago">–</span></div>`;
}
function renderTop() {
  const ov = S.d.ov, L = ov.live, [ms, live] = marketState();
  const m = $("#mkt"); m.className = "pill " + (live ? "ok live" : "off"); m.innerHTML = `<span class="dot"></span>${ms}`;
  const r = $("#risk"), dd = L ? L.drawdown_pct : 0, lim = ov.status.max_dd * 100;
  r.className = "pill " + (dd > lim * .7 ? "bad" : dd > lim * .35 ? "" : "ok"); r.textContent = `RISK ${pct(dd)} / ${pct(lim, 0)}`;
  r.dataset.tip = `Real account is ${pct(dd)} below its highest value.\nBot stops buying at ${pct(lim, 0)}.`;
  const k = $("#kill"); k.className = "pill " + (ov.kill ? "bad" : "ok"); k.textContent = "KILL SWITCH " + (ov.kill ? "ON" : "OFF");
  k.dataset.tip = ov.kill ? "Loss limit hit: the bot will not buy." : "Loss limits not hit: the bot may buy.";
}
function tick() {
  const d = new Date(), o = {timeZone: "Asia/Kolkata"};
  $("#clock").textContent = d.toLocaleTimeString("en-US", {...o, hour: "2-digit", minute: "2-digit", second: "2-digit"}) + " " +
    d.toLocaleDateString("en-GB", {...o, weekday: "short", day: "2-digit", month: "short"}).toUpperCase().replace(",", "") + " IST";
  const s = S.at ? Math.round((Date.now() - S.at) / 1000) : null;
  document.querySelectorAll(".ago").forEach(e => { e.textContent = s == null ? "–" : (S.err ? "refresh failed · " : "") + `updated ${s < 60 ? s + "s" : Math.floor(s / 60) + "m"} ago`; e.className = "ago" + (S.err || s > 90 ? " dn" : ""); });
}

// ---------- render + data ----------
function render() {
  renderNav();
  if (!S.d.ov) return;
  renderTop(); renderSide();
  const ae = document.activeElement, aid = ae && ae.id, sel = ae && ae.selectionStart;
  for (const k in CH) delete CH[k];
  let h; try { h = R[S.sec](); } catch (e) { h = `<div class="err">Could not draw this section: ${esc(e.message)}</div>`; console.warn(e); }
  $("#main").innerHTML = h + `<div class="foot">Read-only view of local files · refreshes every 30s · <span class="ago"></span>${S.err ? ` · <span class="dn">${esc(S.err)}</span>` : ""}</div>`;
  drawCharts(); tick();
  if (aid && document.getElementById(aid)) { const e = document.getElementById(aid); e.focus(); if (sel != null && e.setSelectionRange) try { e.setSelectionRange(sel, sel); } catch (_) {} }
}
async function load(only) {
  const need = only ? [only] : ["ov", "sc", ...(NEED[S.sec] || [])];
  const src = {ov: "overview", sc: "schedule", brain: "brain", st: "strategies", lg: "activity", oc: `chain?idx=${encodeURIComponent(S.oc.idx)}${S.oc.day ? "&day=" + encodeURIComponent(S.oc.day) : ""}`};
  try {
    const res = await Promise.all(need.map(k => get(src[k])));
    need.forEach((k, i) => S.d[k] = res[i]);
    S.at = Date.now(); S.err = "";
  } catch (e) { S.err = String(e.message || e); }
  render();
}
function route() {
  const h = location.hash.slice(1), ids = SECS.flatMap(s => s[1].map(i => i[0]));
  S.sec = ids.includes(h) ? h : "ov";
  const missing = (NEED[S.sec] || []).filter(k => !S.d[k]);
  render(); if (S.d.ov) scrollTo(0, 0);
  if (missing.length || !S.d.ov) load();
}
addEventListener("hashchange", route);

// ---------- interactions (one delegated handler) ----------
document.addEventListener("click", e => {
  const t = e.target;
  const row = t.closest("tr.xr");
  if (row && !t.closest("a")) {
    const k = row.dataset.k, o = !S.open.has(k); o ? S.open.add(k) : S.open.delete(k);
    row.classList.toggle("open", o); row.nextElementSibling.classList.toggle("open", o); row.setAttribute("aria-expanded", o); row.querySelector(".chev").textContent = o ? "−" : "+"; return;
  }
  const b = t.closest("[data-sort],[data-jr],[data-lg],[data-dd],[data-ddall],[data-pt],[data-sttab],[data-idx]"); if (!b) return;
  if (b.dataset.sort) { const [id, k] = b.dataset.sort.split("|"), s = S.sort[id]; S.sort[id] = {k, dir: s && s.k === k ? -s.dir : -1}; }
  if (b.dataset.jr) { if (b.dataset.jr === "__clear") S.jr = {acct: "All", from: "", to: ""}; else S.jr.acct = b.dataset.jr; }
  if (b.dataset.lg) S.lg.f = b.dataset.lg;
  if (b.dataset.dd) S.dd = b.dataset.dd;
  if (b.dataset.ddall) S.ddAll = !S.ddAll;
  if (b.dataset.pt) S.pt = b.dataset.pt;
  if (b.dataset.sttab) S.stTab = b.dataset.sttab;
  if (b.dataset.idx) { S.oc = {idx: b.dataset.idx, day: ""}; return load("oc"); }
  render();
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr.xr")) { e.preventDefault(); e.target.click(); } });
document.addEventListener("change", e => {
  if (e.target.id === "jrfrom") { S.jr.from = e.target.value; render(); }
  if (e.target.id === "jrto") { S.jr.to = e.target.value; render(); }
  if (e.target.id === "ocday") { S.oc.day = e.target.value; load("oc"); }
});
document.addEventListener("input", e => { if (e.target.id === "lgq") { S.lg.q = e.target.value; render(); } });

setInterval(tick, 1000);
setInterval(() => load(), 30000);
tick(); route();
</script>
